# docker-compose.yml
# Airflow สำหรับ SME Retail Weekly Forecast Pipeline
# รัน: docker-compose up airflow-init && docker-compose up -d
# เปิด: http://localhost:8080 (user: airflow / pass: airflow)
 
x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    LINE_NOTIFY_TOKEN: ""   # ใส่ token ถ้าต้องการ Line Notify
    _PIP_ADDITIONAL_REQUIREMENTS: "lightgbm pandas numpy scikit-learn shap mlflow scipy"
  volumes:
    - ./notebooks/dags:/opt/airflow/dags
    - ./notebooks:/opt/airflow/notebooks
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - sme-retail
 
services:
 
  # ── PostgreSQL (Airflow metadata DB) ──────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    networks:
      - sme-retail
 
  # ── Airflow Init (รันครั้งเดียวตอนเริ่ม) ─────────────────
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname SME \
          --lastname Retail \
          --role Admin \
          --email admin@sme-retail.com
    restart: "no"
 
  # ── Airflow Webserver ─────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    restart: unless-stopped
 
  # ── Airflow Scheduler ─────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
 
volumes:
  postgres_data:
 
networks:
  sme-retail:
    driver: bridge